plugins {
    alias(libs.plugins.android.application)
    id 'kotlin-parcelize'
    alias(libs.plugins.google.devtools.ksp)
    alias(libs.plugins.navigation.safeargs.kotlin)
    alias(libs.plugins.jetbrains.kotlin.plugin.compose)
    alias(libs.plugins.jetbrains.kotlin.plugin.serialization)
}


android {
    compileSdkVersion = 37
    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }

    namespace = 'com.prirai.android.nira'

    defaultConfig {
        applicationId = "com.prirai.android.nira"
        minSdkVersion 27
        targetSdkVersion 37
        // Increment by 4 with each update, by 1 with each fix
        versionCode = 48
        versionName = "0.5.6"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            resValue "string", "app_name", "Nira (Debug)"
            applicationIdSuffix = '.debug'
        }
    }

    flavorDimensions = ["abi"]

    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk = false
        }
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.15'
    }

    androidResources {
        noCompress += 'ja'
    }

    lint {
        abortOnError = false
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

def abiBaseMap = ["arm64-v8a"  : 1,
                  "armeabi-v7a": 2
]

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType.toString() == 'ABI' }?.identifier

            if (abi != null) {
                def base = abiBaseMap[abi] ?: 0
                def orig = output.versionCode.get()
                output.versionCode.set(base * 1000 + orig)
            }
        }
    }
}


